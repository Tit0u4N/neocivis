name: CD Backend to Azure Function

on:
  pull_request:
    branches: ['*']
  workflow_run:
    workflows: ["CI (Build & Test)"] 
    types:
      - completed
    branches: 
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev or main)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - main

env:
  AZURE_FUNCTIONAPP_NAME: 'neocivis-functions'   
  AZURE_FUNCTIONAPP_DEV_NAME: 'neocivis-function-dev'   
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'apps/backend'      
  NODE_VERSION: '22.x'                    

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    #if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: 'Setup Node ${{ env.NODE_VERSION }} Environment'
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 'Resolve Project Dependencies Using Yarn'
      shell: bash
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        yarn install
        yarn build 
        popd

    - name: 'Run Azure Functions Action (DEV)'
      if: github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'main'
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_DEV_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_DEV_PUBLISH_PROFILE }}

    - name: 'Run Azure Functions Action (PROD)'
      if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'main'
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PROD_PUBLISH_PROFILE }}