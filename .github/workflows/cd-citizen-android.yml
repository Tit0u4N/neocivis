name: "CD Citizen App (Android Debug APK)"

on:
  push:
    branches: ["main"]
    paths:
      - "apps/citizen-app/**"
      - "packages/**"
      - ".github/workflows/cd-citizen-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/citizen-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (monorepo root)
        working-directory: .
        run: bun install

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-citizen-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-citizen-
            ${{ runner.os }}-turbo-

      - name: Lint citizen-app
        working-directory: .
        run: bunx turbo run lint --filter=citizen-app

      - name: Test citizen-app
        working-directory: .
        run: bunx turbo run test --filter=citizen-app

      - name: Read version from app.json
        id: version
        run: echo "version=$(jq -r '.expo.version' app.json)" >> "$GITHUB_OUTPUT"

      - name: Inject versionCode into app.json
        run: |
          jq --argjson vc ${{ github.run_number }} '.expo.android.versionCode = $vc' app.json > app.json.tmp
          mv app.json.tmp app.json
          echo "versionCode = ${{ github.run_number }}"

      - name: Expo prebuild (android)
        run: bunx expo prebuild --platform android --no-install

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/citizen-app/android/**/*.gradle*', 'apps/citizen-app/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: apps/citizen-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/citizen-app-debug-v${{ steps.version.outputs.version }}-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: citizen-app-android-debug
          path: apps/citizen-app/artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: citizen-android-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: "Citizen App Android Debug v${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          body: |
            Automated debug APK build from commit ${{ github.sha }}.

            - Version: `${{ steps.version.outputs.version }}`
            - versionCode: `${{ github.run_number }}`
            - Branch: `${{ github.ref_name }}`
          files: apps/citizen-app/artifacts/*.apk
          draft: false
          prerelease: true