name: CD Town hall web & Citizen app to Coolify

on:
  pull_request:
    branches: ['*']
  workflow_run:
    workflows: ["CI (Build & Test)"] 
    types:
      - completed
    branches:
        - main
        - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (dev or main)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - main

env:
  COOLIFY_BASE_URL: "https://coolify.shiyamii.com"

jobs:
  deploy-town-hall:
    runs-on: ubuntu-latest
    steps:
      - name: "Configure Town hall web Webhook"
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.environment }}" == "main" ]; then
            echo "Environment: PROD/MAIN"  
            echo "WEBHOOK_URL=${{ secrets.COOLIFY_WEBHOOK_TOWN_HALL_PROD }}" >> $GITHUB_ENV
          else
            echo "Environment: DEV"
            echo "WEBHOOK_URL=${{ secrets.COOLIFY_WEBHOOK_TOWN_HALL_DEV }}" >> $GITHUB_ENV
          fi

      - name: "Deploy and Wait: Town hall web App"
        run: |
          echo "Triggering Town hall web webhook..."
          curl -v -L "$WEBHOOK_URL" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Accept: application/json" \
            -o response.json

          
          # Extraction sécurisée (si vide, retourne une chaîne vide au lieu du texte "null")
          DEPLOY_UUID=$(cat response.json | jq -r '.deployments[0].deployment_uuid // empty')
          
          if [ -z "$DEPLOY_UUID" ]; then
            echo "Error: Failed to retrieve UUID. Check webhook URL or API token."
            exit 1
          fi
          
          echo "Deployment UUID: $DEPLOY_UUID"
          
          while true; do
            STATUS=$(curl -s -L "${{ env.COOLIFY_BASE_URL }}/api/v1/deployments/$DEPLOY_UUID" -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" -H "Accept: application/json" | jq -r '.status')
            echo "Status: $STATUS"
            if [ "$STATUS" == "finished" ]; then break; fi
            if [ "$STATUS" == "failed" ]; then 
              echo "Deployment failed on Coolify side."
              exit 1
            fi
            sleep 10
          done
          echo "Town hall web deployment finished successfully!"

  deploy-citizen-app:
    runs-on: ubuntu-latest
    steps:
      - name: "Configure Citizen App Webhook"
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.environment }}" == "main" ]; then
            echo "WEBHOOK_URL=${{ secrets.COOLIFY_WEBHOOK_CITIZEN_APP_PROD }}" >> $GITHUB_ENV
          else
            echo "WEBHOOK_URL=${{ secrets.COOLIFY_WEBHOOK_CITIZEN_APP_DEV }}" >> $GITHUB_ENV
          fi

      - name: "Deploy and Wait: Citizen App"
        run: |
          echo "Triggering Citizen App webhook..."
          curl -v -L "$WEBHOOK_URL" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Accept: application/json" \
            -o response.json

          DEPLOY_UUID=$(cat response.json | jq -r '.deployments[0].deployment_uuid // empty ')
          
          if [ "$DEPLOY_UUID" == "null" ] || [ -z "$DEPLOY_UUID" ]; then
            echo "Error: Failed to retrieve UUID."
            exit 1
          fi
          
          while true; do
            STATUS=$(curl -s -L -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" "${{ env.COOLIFY_BASE_URL }}/api/v1/deployments/$DEPLOY_UUID" | jq -r '.status')
            if [ "$STATUS" == "finished" ]; then break; fi
            if [ "$STATUS" == "failed" ]; then exit 1; fi
            sleep 10
          done
          echo "Citizen App deployment finished successfully!"