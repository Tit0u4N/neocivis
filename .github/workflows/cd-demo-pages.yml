name: "CD Démo statique (GitHub Pages)"

# Démo sans backend ni Keycloak : le backend Hono tourne en mémoire dans le navigateur
# avec les données de seed. Prérequis : Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation des dépendances
        run: bun install

      - name: Build des packages partagés
        run: bunx turbo run build --filter=town-hall-web^... --filter=citizen-app^...

      - name: Build démo town-hall-web
        working-directory: apps/town-hall-web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/mairie
        run: bun run build:demo

      - name: Build démo citizen-app (web)
        working-directory: apps/citizen-app
        env:
          EXPO_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/citoyen
        run: bun run build:demo

      - name: Assemblage du site
        run: |
          mkdir -p site/mairie site/citoyen
          cp -r apps/town-hall-web/out/. site/mairie/
          cp -r apps/citizen-app/dist/. site/citoyen/
          # Page racine : choix de l'application.
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="fr">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>NeoCivis — Démo</title>
          <style>
            body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f5f7fa; color: #1a2233; }
            main { text-align: center; padding: 16px; }
            a { display: block; margin: 12px auto; padding: 14px 24px; max-width: 280px; border-radius: 12px; background: #1f6f78; color: #fff; text-decoration: none; font-weight: 600; }
            p { color: #5b6476; }
          </style>
          <main>
            <h1>NeoCivis — Démo</h1>
            <p>Données fictives, réinitialisées à chaque rechargement.</p>
            <a href="./mairie/">Espace mairie</a>
            <a href="./citoyen/">Application citoyen</a>
          </main>
          </html>
          HTML
          # GitHub Pages n'utilise que le 404.html racine : on y sert l'app citoyen (SPA) pour
          # les URLs profondes /citoyen/*, sinon on renvoie vers la page 404 de la mairie.
          REPO_PATH="/${{ github.event.repository.name }}"
          GUARD="<script>if(!location.pathname.startsWith('${REPO_PATH}/citoyen/'))location.replace('${REPO_PATH}/mairie/404.html')</script>"
          sed "s#<head>#<head>${GUARD}#" site/citoyen/index.html > site/404.html
          touch site/.nojekyll

      - name: Upload artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
