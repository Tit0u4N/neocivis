AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Test local Hono Lambdas


Resources:
  UserLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/user-lambda.handler
      Runtime: nodejs18.x
      Events:
        UsersRoot:
          Type: HttpApi
          Properties:
            Path: /users
            Method: ANY
        UserProxy:
          Type: HttpApi
          Properties:
            Path: /users/{proxy+}
            Method: ANY

  ProductLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/product-lambda.handler
      Runtime: nodejs18.x
      Events:
        ProductsRoot:
          Type: HttpApi
          Properties:
            Path: /products
            Method: ANY
        ProductProxy:
          Type: HttpApi
          Properties:
            Path: /products/{proxy+}
            Method: ANY

